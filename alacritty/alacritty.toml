[general]
live_config_reload = true

[window]
padding = { x = 5, y = 5 }
dynamic_padding = false
startup_mode = "Maximized"
decorations = "full"
opacity = 0.85

[scrolling]
history = 5000
multiplier = 3

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Regular" }
bold_italic = { family = "FiraCode Nerd Font", style = "Bold" }
size = 12.0

# Optional alternative: Caskaydia Cove Nerd Font
# [font]
# normal = { family = "CaskaydiaCove NF", style = "Regular" }
# bold = { family = "CaskaydiaCove NF", style = "Bold" }
# italic = { family = "CaskaydiaCove NF", style = "Italic" }
# bold_italic = { family = "CaskaydiaCove NF", style = "Bold Italic" }
# size = 12.0

[cursor]
unfocused_hollow = false
style = { shape = "Beam", blinking = "Never" }

[bell]
duration = 0

[selection]
save_to_clipboard = true

[terminal.shell]
program = "wsl.exe"
args = ["--cd", "~"]
