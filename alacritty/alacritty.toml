[general]
import = ["alacritty-theme/themes/gruvbox_dark.toml"]
live_config_reload = false

[window]
padding = { x = 5, y = 5 }
dynamic_padding = false
startup_mode = "Maximized"
decorations = "full"
opacity = 1.0
blur = false

[scrolling]
history = 5000
multiplier = 3

[font]
normal = { family = "CaskaydiaCove Nerd Font Mono", style = "Regular" }
bold = { family = "CaskaydiaCove Nerd Font Mono", style = "Bold" }
italic = { family = "CaskaydiaCove Nerd Font Mono", style = "Italic" }
bold_italic = { family = "CaskaydiaCove Nerd Font Mono", style = "Bold Italic" }
size = 12.0
offset = { x = 0, y = 4 }
glyph_offset = { x = 0, y = 2 }                                                  # Moves the font up to center it

# [font]
# normal = { family = "Fira Code", style = "Regular" }
# bold = { family = "Fira Code", style = "Bold" }
# italic = { family = "Fira Code", style = "Regular" }
# bold_italic = { family = "Fira Code", style = "Bold" }
# size = 12.0

[cursor]
unfocused_hollow = false
style = { shape = "Beam", blinking = "Never" }

[bell]
duration = 0

[selection]
save_to_clipboard = true

[keyboard]
bindings = [{ key = "Back", mods = "Control", chars = "\u0017" }]
