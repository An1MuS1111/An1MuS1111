opensource:
  - name: GNU uutils coreutils & uutils_term_grid
    url: https://github.com/uutils/uutils-term-grid/pull/68
    stack: Rust
    affiliation: 'Rust rewrite of GNU coreutils (24k+ GitHub stars), shipped by default in Ubuntu; `term_grid` lays out the column output of its `ls` and of eza (4.4M+ crates.io downloads).'
    highlights:
      - '*Problem:* `ls --zero` ended rows in column layouts with a newline instead of NUL, breaking scripts that pipe filenames into `xargs -0`.'
      - 'Traced the bug to the grid library''s hardcoded row delimiter and *merged* a configurable line separator upstream (term\_grid \#68), reworking the API in response to maintainer review.'
      - 'Follow-up `ls` fix with regression tests is in review (coreutils \#14789). Also merged a compile fix in *notify-rust* (\#244).'

