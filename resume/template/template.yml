projects:
  - name: ironbarrel
    url: https://github.com/An1MuS1111/ironbarrel
    affiliation: A log-structured hash table key-value storage engine inspired by the orignal bitcask
    stack: Rust
    highlights:
      - Built a high throughput storage engine from ground up in Rust, inspired by the Basho Bitcask paper; designed lock-free concurrent indexing (KeyDir) and positional reads (pread) to achieve 280k+ ops/sec with 1.2µs p50 read latency.
      - Engineered a crash-resilient storage & compaction pipeline using hardware-accelerated CRC32 and binary hint-file indexing, cutting 1M-key startup recovery by 96% (from 2.4s to 80ms) while automatically reclaiming dead disk space.
  - name: Miserable Messengers / Gossip Gloomers
    url: https://github.com/An1MuS1111/Gossip-Glomers-Solved
    affiliation: Fly.io distributed systems challenge series
    stack: Rust, Maelstrom/Jepsen
    highlights:
      - Built a Rust node engine that solved Fly.io distributed systems challenges, including gossip broadcast, CRDT counters, and a linearizable KV store.
      - Verified correctness under network partitions, packet drops, and concurrent clients using Jepsen’s Maelstrom;
