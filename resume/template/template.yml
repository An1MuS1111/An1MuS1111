  - name: ironbarrel
    url: https://github.com/An1MuS1111/ironbarrel
    stack: Rust
    affiliation: An embedded key-value store that serves every read with a single disk seek and restarts quickly after a crash.
    highlights:
      - 'Built from the original Bitcask paper: every write is appended to a log file and an in-memory index remembers where it went, so any read needs at most one disk access. On a 6-core i5: 520k operations/sec on one thread and 3.1M reads/sec on four, at 1.2 µs per read.'
      - 'Automatic clean-up (compaction) runs at 88k writes/sec while keeping disk usage at the size of the live data, after replacing a check that copied every key on each write (previously 7 writes/sec).'
      - 'Hint files cut restart time after a crash from 4.4 s to 0.7 s (−84%); saving to disk every 100 ms costs about 1% throughput. 34 tests cover crashes, corrupted data and concurrent access.'
  - name: Miserable Messengers
    url: https://github.com/An1MuS1111/Miserable-Messengers
    stack: Rust
    affiliation: 'Solutions to Fly.io''s Gossip Glomers: keep nodes correct while the network drops, delays and partitions messages.'
    highlights:
      - 'Wrote my own Maelstrom node library in Rust (one binary per challenge) and solved the same challenges in Go: unique IDs that stay available under partitions, and multi-node gossip broadcast, verified with Jepsen''s Maelstrom' #todo[add challenges 4–6 once pushed; broadcast msgs-per-op / latency].'
      - '*Also:* gzip/DEFLATE decoder from RFC 1951/1952 (Rust) · Distributed Task/Job Scheduler (Go) in progress.'

