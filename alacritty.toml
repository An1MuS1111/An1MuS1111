[general]
import = ["alacritty-theme/themes/gruvbox_dark.toml"]
live_config_reload = true

[font]
# normal = { family = "0xProto Nerd Font Mono", style = "Medium" }
# bold = { family = "0xProto Nerd Font Mono", style = "Bold" }
# normal = { family = "CaskaydiaCove Nerd Font", style = "Medium" }
# bold = { family = "CaskaydiaCove Nerd Font", style = "Bold" }
# normal = { family = "Roboto Mono", style = "Regular" }
# bold = { family = "Roboto Mono", style = "Bold" }
# italic = { family = "Roboto Mono", style = "Italic" }
# bold_italic = { family = "Roboto Mono", style = "Bold Italic" }
normal = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold = { family = "FiraCode Nerd Font Mono", style = "Bold" }
italic = { family = "FiraCode Nerd Font Mono", style = "Italic" }
bold_italic = { family = "FiraCode Nerd Font Mono", style = "Bold Italic" }
size = 12 

[window]
padding = { x = 5, y = 5 }
dynamic_padding = true
startup_mode = "Maximized"
decorations = "full"

[cursor]
unfocused_hollow = true
style = {shape = "Beam", blinking = "Always"}

[selection]
save_to_clipboard = true
