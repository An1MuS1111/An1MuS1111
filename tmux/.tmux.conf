# --- Performance & Core Tuning ---
set -sg escape-time 0                  # Zero delay on Esc key (crucial for Neovim/Vim responsiveness)
set -g repeat-time 300                 # Reduce repeat delay for repeatable keys to avoid key-lock lag
set -g history-limit 5000              # Cap pane scrollback buffer to reduce memory footprint per pane
set -s focus-events on                 # Forward focus events cleanly to Neovim
set -g status-interval 60              # Prevent frequent background process forking from status scripts

# --- Terminal Capabilities & True Color ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"

# --- Basic Settings ---
set -g base-index 1
setw -g pane-base-index 1              # Align pane indexing with window indexing
set -g renumber-windows on             # Automatically renumber windows when one is closed
set -g mouse on
setw -g mode-keys vi

# Change prefix from 'Ctrl+B' to 'Ctrl+A'
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Easy config reload (Prefix + r)
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# Ctrl + Tab to go to the next window
bind-key -n BTab next-window

# --- Lightweight Gruvbox Status & Borders (Zero-Script Overhead) ---
set -g status-position bottom
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left "#[bg=#a89984,fg=#282828,bold] #S #[bg=default,fg=default] "
set -g status-right "#[fg=#a89984]%H:%M "

setw -g window-status-current-style "bg=#fe8019,fg=#282828,bold"
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-style "bg=#3c3836,fg=#a89984"
setw -g window-status-format " #I:#W "

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fe8019"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin Settings
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'    # Saved every 15 min instead of 5 to avoid I/O disk freezes

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
